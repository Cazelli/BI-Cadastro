name: Monitor Streamlit

on:
  schedule:
    # 00:01, 06:01, 12:01 e 18:01 em America/Sao_Paulo (UTC-3).
    - cron: "1 3,9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-streamlit
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.53.0
          playwright install --with-deps chromium

      - name: Verificar e despertar o app
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_DESTINO: ${{ vars.EMAIL_DESTINO }}
          STREAMLIT_URL: https://mobiflex-bi-cadastral.streamlit.app/
          MONITOR_TIMEZONE: America/Sao_Paulo
        run: python monitor_streamlit.py

      - name: Salvar captura em caso de erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-streamlit-error
          path: monitor_streamlit_error.png
          if-no-files-found: ignore
          retention-days: 7
